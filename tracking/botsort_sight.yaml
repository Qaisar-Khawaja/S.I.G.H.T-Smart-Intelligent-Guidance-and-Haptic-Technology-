# Ultralytics 8.4.120 BoT-SORT defaults, pinned for reproducibility.
# Sparse optical flow compensates the cane camera's global ego-motion.
# ReID remains disabled, matching the integrated lightweight default.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: true
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: false
model: auto
